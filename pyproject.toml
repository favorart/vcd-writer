# Python module `vcdwriter`: pip install .  (or git+https://github.com/favorart/vcd-writer)
[build-system]
requires = ["scikit-build-core>=0.10", "setuptools-scm>=8", "nanobind>=2.0"]
build-backend = "scikit_build_core.build"

[project]
name = "vcdwriter"
dynamic = ["version"]
description = "Fast writer of Value Change Dump (VCD) files, IEEE 1364-2005 (C++ vcd-writer)"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.8"

[project.urls]
Repository = "https://github.com/favorart/vcd-writer"

[tool.scikit-build]
minimum-version = "0.10"
metadata.version.provider = "scikit_build_core.metadata.setuptools_scm"
cmake.build-type = "Release"
wheel.packages = []

[tool.scikit-build.cmake.define]
VCDWRITER_BUILD_PYTHON = "ON"
VCDWRITER_BUILD_MAIN = "OFF"
VCDWRITER_BUILD_TESTS = "OFF"

# the version is the git tag vX.Y.Z made by CI
[tool.setuptools_scm]
